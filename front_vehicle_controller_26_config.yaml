                samples_buffered: 1
            fvcSdcStatus3:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcSdcStatus4:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcDriveSpeedMode_state:
