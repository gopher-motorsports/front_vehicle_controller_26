module_name: "fvc"

# NOTE: Frequencies will be converted to an integer number of ms for a delay

buckets:
    high_frequency:
        frequency_hz: 200
        parameters:
            fvcWheelSpeedFrontLeft_m_per_s:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcWheelSpeedFrontRight_m_per_s:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcWheelSpeedRearLeft_m_per_s:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcWheelSpeedRearRight_m_per_s:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcShockPosFrontLeft_mm:
                ADC: ADC1_IN1
                sensor: front_left_shock_pos
                samples_buffered: 1
            fvcShockPosFrontRight_mm:
                ADC: ADC1_IN0
                sensor: front_right_shock_pos
                samples_buffered: 1

    medium_freqeuncy:
        frequency_hz: 100
        parameters:
            fvcPedalPosition1_mm:
                ADC: ADC1_IN3
                sensor: linear_pos_sensor_25
                samples_buffered: 1
            fvcPedalPosition2_mm:
                ADC: ADC1_IN14
                sensor: linear_pos_sensor_25
                samples_buffered: 1
            fvcPedalPosition1_percent:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcPedalPosition2_percent:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcBrakePressureFront_psi:
                ADC: ADC1_IN11
                sensor: brake_pressure_sensor_rife
                samples_buffered: 1
            fvcSteeringAngle_deg:
                ADC: ADC1_IN2
                sensor: steering_angle_sensor
                samples_buffered: 1
    low_freqeuncy:
        frequency_hz: 5
        parameters:
            fvcBrakeTempFrontLeft_C:
                ADC: ADC1_IN6
                sensor: brake_temp_sensor
                samples_buffered: 1
            fvcBrakeTempFrontRight_C:
                ADC: ADC1_IN7
                sensor: brake_temp_sensor
                samples_buffered: 1
            fvcFrontRideHeight_mm:
                ADC: ADC1_IN15
                sensor: full_raw_voltage_sensor
                samples_buffered: 1
            fvcPedalPosition1Fault_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcPedalPosition2Fault_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcPedalPositionCorrelationFault_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcDisplayFaultStatus_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcVehicleState_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcMcuStatus_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcSdcStatus3:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcSdcStatus4:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcDriveSpeedMode_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1