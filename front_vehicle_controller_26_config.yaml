                samples_buffered: 1
            fvcMotorTemp_FL_C:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcMotorTemp_FR_C:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcMotorTemp_RL_C:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcMotorTemp_RR_C:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            
            # Efuse Fault Data
            fvcEfuse3V3SNSFault_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcEfuse5VSNSFault1_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcEfuse5VSNSFault2_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcEfuse5VSWMFault_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcEfuse12VSNSFault_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcEfuse12VDispFault_state:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcEfuse12VDispCurrent_A:
                ADC: ADC1_IN8
