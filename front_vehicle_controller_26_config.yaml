                sensor: NON_ADC
                samples_buffered: 1
            fvcControllerTemp_FR_C:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcControllerTemp_RL_C:
                ADC: NON_ADC
                sensor: NON_ADC
                samples_buffered: 1
            fvcControllerTemp_RR_C:
                ADC: NON_ADC
